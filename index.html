<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleaveTech</title>
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>

<header class="landing__header">
  <p class="landing__title">CleaveTech</p>
  <nav class="landing__nav">
    <a href="about/" class="landing__nav-link">About</a>
    <a href="contact/" class="landing__nav-link">Contact</a>
  </nav>
</header>

<main class="landing">

  <svg
    class="portfolio-svg"
    viewBox="0 0 640 480"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="Interactive portfolio — select a discipline to explore projects"
  >
    <!-- Arc label paths are injected here by main.js -->
    <defs id="js-defs"></defs>

    <!-- Layer 2: inner background geometry (bounded star) -->
    <g id="js-bg-lines"></g>

    <!-- Layer 3: connecting lines from discipline to project icons -->
    <g id="js-lines"></g>

    <!-- Layer 4: project icons and arc labels -->
    <g id="js-icons"></g>

    <!-- Layer 5: discipline buttons (on top) -->
    <g id="js-disciplines"></g>
  </svg>

</main>

    <script src="src/js/main.js"></script>

  </body>
</html>
